name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q

  containers:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Validate Compose configuration
        env:
          INSIGHT_API_KEY: ci-only-not-a-deployment-secret
        run: docker compose config --quiet
      - name: Build application image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: insight-engine:ci
      - name: Start and smoke-test application container
        env:
          INSIGHT_API_KEY: ci-only-not-a-deployment-secret-with-more-than-32-chars
        run: |
          set -eu
          docker run --detach --name insight-engine-ci \
            --publish 10000:10000 \
            --env PORT=10000 \
            --env INSIGHT_API_KEY="$INSIGHT_API_KEY" \
            --env DATABASE_URL=sqlite:////app/data/insight_engine.db \
            insight-engine:ci
          cleanup() { docker logs insight-engine-ci; docker rm --force insight-engine-ci; }
          trap cleanup EXIT
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://localhost:10000/_stcore/health >/dev/null \
              && curl --fail --silent http://localhost:10000/api/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 90 ]; then
              echo "Container did not become healthy." >&2
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://localhost:10000/ | grep -qi "streamlit"
          curl --fail --silent http://localhost:10000/api/docs | grep -q "swagger"
          status=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            http://localhost:10000/api/datasets)
          test "$status" = "401"
